<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Custom Crafted Sites</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#111114">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--ink:#111114;--paper:#F6F6F3;--line:#E2E2DC;--muted:#55565E;--blue:#2E4BFF;--lime:#D4F57A}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
header{border-bottom:1px solid var(--line)}
header div{max-width:1200px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo .mark{width:34px;height:34px;border-radius:9px;background:var(--ink);display:flex;align-items:center;justify-content:center}
.logo b{font-family:'Space Grotesk',sans-serif;font-size:20px;letter-spacing:-.02em}
main{flex:1;max-width:640px;margin:0 auto;padding:80px 24px;display:flex;flex-direction:column;justify-content:center}
.code{display:inline-block;align-self:flex-start;background:var(--ink);color:var(--lime);font-weight:600;font-size:13px;padding:7px 12px;border-radius:999px}
h1{font-family:'Space Grotesk',Inter,sans-serif;letter-spacing:-.03em;font-size:clamp(34px,7vw,52px);line-height:1.05;margin:18px 0 12px}
p{margin:0;font-size:18px;line-height:1.55;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 20px;border-radius:12px;font-weight:600;font-size:16px;text-decoration:none;min-height:50px}
.blue{background:var(--blue);color:#fff}.line{border:1.5px solid var(--ink);color:var(--ink);background:#fff}
.small{margin-top:24px;font-size:15px}.small a{color:var(--ink);font-weight:600}
@media (max-width:640px){main{padding:56px 16px}.btn{flex:1 1 100%}.logo b{font-size:17px}}
#ccs-faq-extra{display:none!important}
</style>
</head>
<body>
<header><div><a class="logo" href="/"><span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D4F57A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19 19 5"/><path d="M9 5h10v10"/></svg></span><b>Custom Crafted Sites</b></a></div></header>
<main>
<span class="code">404 · Page not found</span>
<h1>This page took a wrong turn.</h1>
<p>The link may be old or mistyped. Everything you need is one tap away.</p>
<div class="actions">
<a class="btn blue" href="/">Go to the homepage</a>
<a class="btn line" href="/#pricing">See packages &amp; pricing</a>
<a class="btn line" href="/book">Book a free call</a>
</div>
<p class="small">Or call/text <a href="tel:+15162885999">(516) 288-5999</a> — open daily 9 AM–9 PM.</p>
</main>
</body>
</html>
